plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}
version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}-neoforge" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
neoForge {
    version = neo_version
    runs {
        client {
            client()
            gameDirectory = file('run/client')
            if (providers.gradleProperty('clientSmokeTest').getOrElse('false').toBoolean()) {
                systemProperty 'murasame.clientSmokeTest', 'true'
                programArguments.addAll '--quickPlaySingleplayer', 'murasame-smoke'
            }
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
// Preserve the historical nested project snapshot without compiling duplicate classes.
sourceSets.main.java.exclude 'cn/adwadg/murasame/events/src/**'
sourceSets.main.resources.srcDir 'src/generated/resources'
if (providers.gradleProperty('enableGameTests').getOrElse('false').toBoolean()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
}
repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    // Compile against the exact installed release when building beside Journey Beyond.
    def runtimeMods = file(modpack_mods_dir)
    if (runtimeMods.isDirectory()) {
        def matches = fileTree(runtimeMods) { include "*SlashBladeResharped-${slashblade_version}.jar" }.files
        if (matches.size() != 1) {
            throw new GradleException("Expected exactly one SlashBlade ${slashblade_version} JAR in ${runtimeMods}; found ${matches}")
        }
        implementation files(matches)
    } else {
        implementation "maven.modrinth:slashblade-resharped:${slashblade_version}"
    }
}
tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_license: mod_license, mod_authors: mod_authors, mod_description: mod_description,
                      minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range,
                      loader_version_range: loader_version_range, slashblade_version_range: slashblade_version_range]
    inputs.properties properties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand properties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) { from 'LICENSE' }
tasks.withType(AbstractArchiveTask).configureEach {
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
